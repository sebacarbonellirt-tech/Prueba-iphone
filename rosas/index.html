<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a0508">
<title>Rosas para Karin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
<style>
  :root { --bg1:#2a0710; --bg2:#0d0204; --text:#ffe6ea; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; background:var(--bg2); }
  body {
    background: radial-gradient(ellipse at 50% 40%, var(--bg1) 0%, var(--bg2) 75%);
    font-family: Georgia, "Times New Roman", serif;
    color: var(--text);
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    user-select: none;
  }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; }
  .hint {
    position:fixed; left:0; right:0; bottom:calc(24px + env(safe-area-inset-bottom));
    text-align:center; font-size:14px; letter-spacing:.2em; text-transform:uppercase;
    opacity:0; transition:opacity 1.5s ease; pointer-events:none;
    text-shadow:0 2px 12px rgba(0,0,0,.8);
  }
  .hint.show { opacity:.75; }

  /* ---------- Sobre y carta ---------- */
  #scene { position:fixed; inset:0; z-index:5; pointer-events:none; }
  #env {
    position:absolute; width:var(--ew); height:var(--eh);
    left:calc(50% - var(--ew) / 2); top:var(--etop);
    opacity:0; transform:translateY(40px) scale(.7);
    transition:opacity .7s ease, transform .7s cubic-bezier(.2,1.4,.4,1);
    filter:drop-shadow(0 18px 30px rgba(0,0,0,.55));
  }
  #scene.show #env { opacity:1; transform:none; }
  .env-back, .env-front, .env-flap { position:absolute; inset:0; border-radius:6px; }
  .env-back  { background:#8e1029; z-index:1; }
  .env-clip  { position:absolute; z-index:2; overflow:hidden; }
  .env-front {
    z-index:3;
    background:linear-gradient(160deg, #d4304d 0%, #b01932 100%);
    clip-path:polygon(0 0, 50% 54%, 100% 0, 100% 100%, 0 100%);
  }
  .env-flap {
    z-index:4; transform-origin:50% 0;
    background:linear-gradient(180deg, #e04460 0%, #c22340 100%);
    clip-path:polygon(0 0, 100% 0, 50% 60%);
    transform:perspective(900px) rotateX(0deg);
    transition:transform .75s ease-in-out;
  }
  #env.open .env-flap { transform:perspective(900px) rotateX(180deg); }
  #env.flap-back .env-flap { z-index:1; }
  .seal {
    position:absolute; z-index:5; left:50%; top:56%;
    width:calc(var(--ew) * .13); height:calc(var(--ew) * .13);
    transform:translate(-50%,-50%); border-radius:50%;
    background:radial-gradient(circle at 35% 35%, #f6d36b, #b8862b);
    display:grid; place-items:center; color:#8e1029;
    font-size:calc(var(--ew) * .07); box-shadow:0 2px 6px rgba(0,0,0,.4);
    transition:opacity .3s ease;
  }
  #env.open .seal { opacity:0; }

  #final { position:fixed; inset:0; z-index:6; display:grid; place-items:center; pointer-events:none; }
  #letter {
    position:absolute; left:0; width:var(--lw); height:var(--lh);
    container-type:inline-size;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(255,255,255,.9), transparent 60%),
      linear-gradient(180deg, #fffaf3 0%, #fbeee4 100%);
    border-radius:6px;
    box-shadow:0 20px 50px rgba(0,0,0,.5), inset 0 0 0 1px rgba(160,40,70,.15);
    color:#7a1a32; text-align:center; overflow:hidden;
  }
  #final #letter { position:relative; }
  #letter::before {
    content:""; position:absolute; inset:7px; border:1.5px solid rgba(196,31,60,.35);
    border-radius:4px; pointer-events:none;
  }
  .letter-body {
    position:absolute; inset:0; padding:12cqw 8cqw 30cqw;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2.5cqw;
  }
  .l-to { font-family:Georgia, serif; font-style:italic; font-size:6cqw; letter-spacing:.08em; color:#a3324a; }
  .l-name {
    font-family:"Great Vibes", "Snell Roundhand", "Apple Chancery", cursive;
    font-size:26cqw; line-height:1; color:#c41f3c;
    text-shadow:0 2px 0 rgba(255,255,255,.8), 0 4px 14px rgba(196,31,60,.25);
  }
  .l-div { display:flex; align-items:center; gap:3cqw; width:60%; color:#d4304d; font-size:5cqw; }
  .l-div::before, .l-div::after { content:""; flex:1; height:1px; background:currentColor; opacity:.5; }
  .l-msg { font-family:Georgia, serif; font-size:5.6cqw; line-height:1.45; color:#7a1a32; }

  .poodle {
    position:absolute; bottom:4cqw; width:25cqw; height:auto;
    opacity:0; transform:translateY(20px) scale(.6);
  }
  .poodle.left  { left:4cqw; }
  .poodle.right { right:4cqw; }
  .poodle.right svg { transform:scaleX(-1); }
  .poodle svg { display:block; width:100%; height:auto; overflow:visible; }
  #letter.ready .poodle { animation:pop .6s cubic-bezier(.2,1.6,.4,1) forwards, hop 2.4s ease-in-out .9s infinite; }
  #letter.ready .poodle.right { animation-delay:.25s, 2.1s; }
  @keyframes pop { to { opacity:1; transform:none; } }
  @keyframes hop {
    0%, 60%, 100% { transform:translateY(0); }
    70% { transform:translateY(-14%); }
    80% { transform:translateY(0); }
    88% { transform:translateY(-6%); }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hint" id="hint">Toca para más rosas 🌹</div>
<div id="scene">
  <div id="env">
    <div class="env-back"></div>
    <div class="env-clip" id="clip">
      <div id="letter">
        <div class="letter-body">
          <div class="l-to">Para</div>
          <div class="l-name">Karin</div>
          <div class="l-div">♥</div>
          <div class="l-msg">Todas estas rosas<br>son para ti 🌹</div>
        </div>
        <div class="poodle left" id="poodleL"></div>
        <div class="poodle right" id="poodleR"></div>
      </div>
    </div>
    <div class="env-front"></div>
    <div class="env-flap"></div>
    <div class="seal">♥</div>
  </div>
</div>
<div id="final"></div>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W = 0, H = 0, DPR = Math.min(window.devicePixelRatio || 1, 2);

  function resize() {
    W = innerWidth; H = innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  addEventListener('resize', resize); resize();

  // ---------- Rose sprites (pre-rendered for speed) ----------
  const PALETTES = [
    { dark:'#5c0010', mid:'#b0001e', light:'#ff3b55' },  // rojo
    { dark:'#4a0012', mid:'#8f0020', light:'#e0213f' },  // carmesí
    { dark:'#7a1840', mid:'#d6407a', light:'#ff9cc2' },  // rosa
    { dark:'#8c3a52', mid:'#f07ca0', light:'#ffd1e0' },  // rosa pálido
    { dark:'#6b0a2a', mid:'#c4124f', light:'#ff5c8a' },  // fucsia
  ];
  const SPRITE = 160;

  function petal(c, r, w) {
    c.beginPath();
    c.moveTo(0, 0);
    c.bezierCurveTo(-w, -r * 0.25, -w * 1.15, -r * 0.95, 0, -r);
    c.bezierCurveTo(w * 1.15, -r * 0.95, w, -r * 0.25, 0, 0);
    c.closePath();
  }

  function makeRose(p, withLeaves) {
    const cv = document.createElement('canvas');
    cv.width = cv.height = SPRITE;
    const c = cv.getContext('2d');
    c.translate(SPRITE / 2, SPRITE / 2);
    const R = SPRITE * 0.36;

    if (withLeaves) {
      for (const a of [-0.6, 2.4, 4.0]) {
        c.save(); c.rotate(a);
        const g = c.createLinearGradient(0, 0, 0, -R * 1.35);
        g.addColorStop(0, '#0f3d12'); g.addColorStop(1, '#3f8f2e');
        c.fillStyle = g;
        c.beginPath(); c.moveTo(0, -R * 0.4);
        c.quadraticCurveTo(-R * 0.35, -R * 0.95, 0, -R * 1.38);
        c.quadraticCurveTo(R * 0.35, -R * 0.95, 0, -R * 0.4);
        c.fill();
        c.strokeStyle = 'rgba(10,40,10,.6)'; c.lineWidth = 1;
        c.beginPath(); c.moveTo(0, -R * 0.45); c.lineTo(0, -R * 1.3); c.stroke();
        c.restore();
      }
    }

    const layers = [
      { n: 6, r: R,        w: R * 0.62, off: 0 },
      { n: 5, r: R * 0.78, w: R * 0.52, off: 0.5 },
      { n: 5, r: R * 0.58, w: R * 0.42, off: 0.15 },
      { n: 4, r: R * 0.40, w: R * 0.32, off: 0.8 },
      { n: 3, r: R * 0.24, w: R * 0.22, off: 0.3 },
    ];
    layers.forEach((L, li) => {
      for (let i = 0; i < L.n; i++) {
        c.save();
        c.rotate(L.off + i * Math.PI * 2 / L.n + (Math.random() - 0.5) * 0.25);
        const g = c.createRadialGradient(0, -L.r * 0.15, 1, 0, -L.r * 0.5, L.r);
        g.addColorStop(0, p.dark);
        g.addColorStop(0.55, p.mid);
        g.addColorStop(1, p.light);
        c.fillStyle = g;
        c.shadowColor = 'rgba(0,0,0,.45)';
        c.shadowBlur = 6 - li;
        petal(c, L.r, L.w);
        c.fill();
        c.shadowBlur = 0;
        c.strokeStyle = 'rgba(40,0,8,.35)'; c.lineWidth = 0.8;
        c.stroke();
        c.restore();
      }
    });

    // Espiral central
    c.strokeStyle = p.dark; c.lineWidth = 1.6; c.lineCap = 'round';
    c.beginPath();
    for (let t = 0; t < Math.PI * 5; t += 0.15) {
      const rr = 1 + t * R * 0.012;
      const x = Math.cos(t) * rr, y = Math.sin(t) * rr;
      t === 0 ? c.moveTo(x, y) : c.lineTo(x, y);
    }
    c.stroke();
    return cv;
  }

  function makePetal(p) {
    const cv = document.createElement('canvas');
    cv.width = cv.height = 40;
    const c = cv.getContext('2d');
    c.translate(20, 32);
    const g = c.createLinearGradient(0, 0, 0, -28);
    g.addColorStop(0, p.dark); g.addColorStop(1, p.light);
    c.fillStyle = g;
    petal(c, 28, 14);
    c.fill();
    return cv;
  }

  const roses = [], petals = [];
  PALETTES.forEach(p => {
    roses.push(makeRose(p, true));
    roses.push(makeRose(p, false));
    petals.push(makePetal(p));
  });

  // ---------- Particles ----------
  const items = [];
  const MAX = reduced ? 120 : (W * H < 500000 ? 380 : 600);
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = arr => arr[(Math.random() * arr.length) | 0];

  function spawn(x, y, vx, vy, isPetal) {
    if (items.length >= MAX) items.shift();
    const base = Math.min(W, H);
    items.push({
      x, y, vx, vy,
      rot: rand(0, Math.PI * 2),
      vr: rand(-1.5, 1.5),
      size: isPetal ? rand(10, 22) : rand(base * 0.07, base * 0.16),
      img: isPetal ? pick(petals) : pick(roses),
      phase: rand(0, Math.PI * 2),
      sway: rand(15, 45),
      life: 0,
      flip: rand(0.6, 1.4),
      petal: isPetal,
    });
  }

  function burst(cx, cy, n, power) {
    for (let i = 0; i < n; i++) {
      const a = rand(0, Math.PI * 2);
      const s = rand(power * 0.25, power);
      spawn(cx, cy, Math.cos(a) * s, Math.sin(a) * s - power * 0.25, Math.random() < 0.3);
    }
  }

  // Entrada: una gran explosión de rosas + lluvia inmediata
  function intro() {
    const n = reduced ? 60 : 220;
    burst(W / 2, H / 2, n, Math.max(W, H) * 1.1);
    for (let i = 0; i < (reduced ? 30 : 120); i++) {
      spawn(rand(0, W), rand(-H, 0), rand(-20, 20), rand(60, 160), Math.random() < 0.4);
    }
  }

  let rainAcc = 0;
  const RAIN_PER_SEC = reduced ? 6 : 28;

  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;

    rainAcc += RAIN_PER_SEC * dt;
    while (rainAcc >= 1) {
      rainAcc--;
      spawn(rand(-40, W + 40), -80, rand(-15, 15), rand(50, 140), Math.random() < 0.45);
    }

    ctx.clearRect(0, 0, W, H);
    for (let i = items.length - 1; i >= 0; i--) {
      const o = items[i];
      o.life += dt;
      // Arrastre y gravedad suave
      const drag = Math.pow(0.12, dt);
      o.vx *= drag;
      o.vy = o.vy * drag + (o.petal ? 180 : 270) * dt; // velocidad terminal ~85-130 px/s
      o.x += (o.vx + Math.sin(o.life * 1.6 + o.phase) * o.sway) * dt;
      o.y += o.vy * dt;
      o.rot += o.vr * dt;

      if (o.y - o.size > H + 40) { items.splice(i, 1); continue; }

      const sx = Math.cos(o.life * o.flip + o.phase); // giro 3D aparente
      ctx.save();
      ctx.translate(o.x, o.y);
      ctx.rotate(o.rot);
      ctx.scale(o.petal ? sx : 0.85 + 0.15 * sx, 1);
      ctx.globalAlpha = Math.min(1, o.life * 3);
      const s = o.size * (o.petal ? 1 : 1.6);
      ctx.drawImage(o.img, -s / 2, -s / 2, s, s);
      ctx.restore();
    }
    requestAnimationFrame(frame);
  }

  function onTap(e) {
    const t = e.touches ? e.touches[0] : e;
    burst(t.clientX, t.clientY, reduced ? 15 : 45, Math.min(W, H) * 0.9);
  }
  addEventListener('pointerdown', onTap);

  // ---------- Poodles (SVG) ----------
  function poodle(F, S, bow) {
    const fur = `
      <polygon points="22,55 28,51 16,28 11,32"/>
      <circle cx="12" cy="25" r="9"/><circle cx="7" cy="20" r="6"/><circle cx="16" cy="18" r="6"/>
      <circle cx="30" cy="55" r="14"/><circle cx="38" cy="48" r="11"/><circle cx="36" cy="63" r="11"/>
      <ellipse cx="55" cy="60" rx="22" ry="11"/>
      <circle cx="72" cy="50" r="15"/><circle cx="80" cy="58" r="12"/><circle cx="67" cy="63" r="11"/><circle cx="79" cy="43" r="11"/>
      <rect x="40" y="64" width="8" height="30" rx="3"/><circle cx="44" cy="95" r="8"/>
      <rect x="77" y="64" width="8" height="30" rx="3"/><circle cx="81" cy="95" r="8"/>
      <circle cx="87" cy="30" r="12"/>
      <ellipse cx="101" cy="35" rx="11" ry="6.5"/>
      <circle cx="85" cy="16" r="10"/><circle cx="78" cy="21" r="7"/><circle cx="93" cy="13" r="7"/><circle cx="87" cy="7" r="6"/>`;
    const ear = `<circle cx="79" cy="34" r="8"/><circle cx="78" cy="44" r="7.5"/><circle cx="82" cy="40" r="7"/>`;
    return `<svg viewBox="-2 -4 118 112" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <g fill="${S}">
        <rect x="33" y="62" width="7" height="30" rx="3"/><circle cx="36.5" cy="94" r="7"/>
        <rect x="70" y="62" width="7" height="30" rx="3"/><circle cx="73.5" cy="94" r="7"/>
      </g>
      <g fill="${F}" stroke="${S}" stroke-width="3.5" stroke-linejoin="round">${fur}</g>
      <g fill="${F}">${fur}</g>
      <g fill="${S}" stroke="${S}" stroke-width="2">${ear}</g>
      <circle cx="111" cy="34" r="3.4" fill="#2b1a1a"/>
      <circle cx="93" cy="28" r="2.6" fill="#2b1a1a"/><circle cx="93.9" cy="27.2" r=".9" fill="#fff"/>
      <circle cx="96" cy="37" r="3.2" fill="#ff8fa8" opacity=".55"/>
      <path d="M104 39 q3 3 6 0" fill="none" stroke="#2b1a1a" stroke-width="1.3" stroke-linecap="round"/>
      <g transform="translate(80 5) rotate(-15)">
        <path d="M0 0 L-8 -5 L-8 5 Z M0 0 L8 -5 L8 5 Z" fill="${bow}"/>
        <circle r="2.4" fill="${bow}" stroke="rgba(0,0,0,.2)" stroke-width=".6"/>
      </g>
    </svg>`;
  }
  document.getElementById('poodleL').innerHTML = poodle('#fffaf5', '#d6c4b6', '#ff5c8a');
  document.getElementById('poodleR').innerHTML = poodle('#f2c79b', '#c48c5a', '#e0213f');

  // ---------- Sobre que se abre ----------
  function openLetter() {
    const scene = document.getElementById('scene');
    const env = document.getElementById('env');
    const clip = document.getElementById('clip');
    const letter = document.getElementById('letter');
    const vw = innerWidth, vh = innerHeight;
    const EW = Math.min(vw * 0.82, 340), EH = EW * 0.64;
    const LW = EW * 0.9, LH = Math.min(LW * 1.32, vh * 0.7);
    const etop = Math.min(vh - EH - 16, Math.max(vh / 2 - EH / 2, LH + 24));
    const clipH = EH + LH + 40;
    const st = document.documentElement.style;
    st.setProperty('--ew', EW + 'px'); st.setProperty('--eh', EH + 'px');
    st.setProperty('--lw', LW + 'px'); st.setProperty('--lh', LH + 'px');
    st.setProperty('--etop', etop + 'px');
    Object.assign(clip.style, { left: (EW - LW) / 2 + 'px', width: LW + 'px', bottom: '0', height: clipH + 'px' });
    letter.style.top = (clipH - EH + EH * 0.06) + 'px';

    scene.classList.add('show');
    setTimeout(() => env.classList.add('open'), 900);
    setTimeout(() => env.classList.add('flap-back'), 1280);
    setTimeout(() => {
      letter.animate([{ transform: 'translateY(0)' }, { transform: `translateY(${-(LH + EH * 0.06 + 10)}px)` }],
        { duration: 1100, easing: 'cubic-bezier(.5,0,.3,1)', fill: 'forwards' });
    }, 1700);
    setTimeout(() => {
      const r = letter.getBoundingClientRect();
      letter.getAnimations().forEach(a => a.cancel());
      letter.style.top = '';
      document.getElementById('final').appendChild(letter);
      const dx = r.left + r.width / 2 - vw / 2, dy = r.top + r.height / 2 - vh / 2;
      const sc = Math.min(1.12, (vw * 0.92) / LW, (vh * 0.9) / LH);
      letter.animate([{ transform: `translate(${dx}px, ${dy}px) scale(1)` }, { transform: `scale(${sc})` }],
        { duration: 900, easing: 'cubic-bezier(.3,1.2,.4,1)', fill: 'forwards' });
      env.animate([{ transform: 'none', opacity: 1 }, { transform: 'translateY(60vh) rotate(8deg)', opacity: 0 }],
        { duration: 800, easing: 'ease-in', fill: 'forwards' });
      setTimeout(() => letter.classList.add('ready'), 700);
    }, 2900);
  }

  intro();
  requestAnimationFrame(frame);
  setTimeout(openLetter, 2300);
  setTimeout(() => document.getElementById('hint').classList.add('show'), 7000);
})();
</script>
</body>
</html>
