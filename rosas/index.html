<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a0508">
<title>Rosas para Karin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
<style>
  :root { --bg1:#2a0710; --bg2:#0d0204; --text:#ffe6ea; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; background:var(--bg2); }
  body {
    background: radial-gradient(ellipse at 50% 40%, var(--bg1) 0%, var(--bg2) 75%);
    font-family: Georgia, "Times New Roman", serif;
    color: var(--text);
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    user-select: none;
  }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; }
  .hint {
    position:fixed; left:0; right:0; bottom:calc(24px + env(safe-area-inset-bottom));
    text-align:center; font-size:14px; letter-spacing:.2em; text-transform:uppercase;
    opacity:0; transition:opacity 1.5s ease; pointer-events:none;
    text-shadow:0 2px 12px rgba(0,0,0,.8);
  }
  .hint.show { opacity:.75; }

  /* ---------- Sobre y carta ---------- */
  #scene { position:fixed; inset:0; z-index:5; pointer-events:none; }
  #env {
    position:absolute; width:var(--ew); height:var(--eh);
    left:calc(50% - var(--ew) / 2); top:var(--etop);
    opacity:0; transform:translateY(40px) scale(.7);
    transition:opacity .7s ease, transform .7s cubic-bezier(.2,1.4,.4,1);
    filter:drop-shadow(0 18px 30px rgba(0,0,0,.55));
  }
  #scene.show #env { opacity:1; transform:none; }
  .env-back, .env-front, .env-flap { position:absolute; inset:0; border-radius:6px; }
  .env-back  { background:#8e1029; z-index:1; }
  .env-clip  { position:absolute; z-index:2; overflow:hidden; }
  .env-front {
    z-index:3;
    background:linear-gradient(160deg, #d4304d 0%, #b01932 100%);
    clip-path:polygon(0 0, 50% 54%, 100% 0, 100% 100%, 0 100%);
  }
  .env-flap {
    z-index:4; transform-origin:50% 0;
    background:linear-gradient(180deg, #e04460 0%, #c22340 100%);
    clip-path:polygon(0 0, 100% 0, 50% 60%);
    transform:perspective(900px) rotateX(0deg);
    transition:transform .75s ease-in-out;
  }
  #env.open .env-flap { transform:perspective(900px) rotateX(180deg); }
  #env.flap-back .env-flap { z-index:1; }
  .seal {
    position:absolute; z-index:5; left:50%; top:56%;
    width:calc(var(--ew) * .13); height:calc(var(--ew) * .13);
    transform:translate(-50%,-50%); border-radius:50%;
    background:radial-gradient(circle at 35% 35%, #f6d36b, #b8862b);
    display:grid; place-items:center; color:#8e1029;
    font-size:calc(var(--ew) * .07); box-shadow:0 2px 6px rgba(0,0,0,.4);
    transition:opacity .3s ease;
  }
  #env.open .seal { opacity:0; }

  #final { position:fixed; inset:0; z-index:6; display:grid; place-items:center; pointer-events:none; }
  #letter {
    position:absolute; left:0; width:var(--lw); height:var(--lh);
    container-type:inline-size;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(255,255,255,.9), transparent 60%),
      linear-gradient(180deg, #fffaf3 0%, #fbeee4 100%);
    border-radius:6px;
    box-shadow:0 20px 50px rgba(0,0,0,.5), inset 0 0 0 1px rgba(160,40,70,.15);
    color:#7a1a32; text-align:center; overflow:hidden;
  }
  #final #letter { position:relative; }
  #letter::before {
    content:""; position:absolute; inset:7px; border:1.5px solid rgba(196,31,60,.35);
    border-radius:4px; pointer-events:none;
  }
  .letter-body {
    position:absolute; inset:0; padding:10cqw 8cqw 32cqw;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2.5cqw;
  }
  .l-to { font-family:Georgia, serif; font-style:italic; font-size:6cqw; letter-spacing:.08em; color:#a3324a; }
  .l-name {
    font-family:"Great Vibes", "Snell Roundhand", "Apple Chancery", cursive;
    font-size:26cqw; line-height:1; color:#c41f3c;
    text-shadow:0 2px 0 rgba(255,255,255,.8), 0 4px 14px rgba(196,31,60,.25);
  }
  .l-div { display:flex; align-items:center; gap:3cqw; width:60%; color:#d4304d; font-size:5cqw; }
  .l-div::before, .l-div::after { content:""; flex:1; height:1px; background:currentColor; opacity:.5; }
  .l-msg { font-family:Georgia, serif; font-size:5.6cqw; line-height:1.45; color:#7a1a32; }

  .poodle {
    position:absolute; bottom:4cqw; width:22cqw; height:auto;
    opacity:0; transform:translateY(20px) scale(.6);
  }
  .poodle.left  { left:4cqw; }
  .poodle.right { right:4cqw; }
  .poodle img { display:block; width:100%; height:auto; filter:drop-shadow(0 3px 4px rgba(122,26,50,.18)); }
  #letter.ready .poodle { animation:pop .6s cubic-bezier(.2,1.6,.4,1) forwards, hop 2.4s ease-in-out .9s infinite; }
  #letter.ready .poodle.right { animation-delay:.25s, 2.1s; }
  @keyframes pop { to { opacity:1; transform:none; } }
  @keyframes hop {
    0%, 60%, 100% { transform:translateY(0); }
    70% { transform:translateY(-14%); }
    80% { transform:translateY(0); }
    88% { transform:translateY(-6%); }
  }

  /* ---------- Rompecabezas ---------- */
  #puzzle { position:fixed; inset:0; z-index:8; transition:opacity .9s ease; touch-action:none; }
  #puzzle.hide { opacity:0; pointer-events:none; }
  .pz-head {
    position:absolute; left:0; right:0; top:calc(env(safe-area-inset-top) + 4vh);
    text-align:center; pointer-events:none; padding:0 16px;
  }
  .pz-title {
    font-family:"Great Vibes", "Snell Roundhand", cursive; color:#ffd9e2;
    font-size:clamp(44px, 12vw, 72px); line-height:1.05;
    text-shadow:0 0 18px rgba(255,80,120,.45);
  }
  .pz-sub { margin-top:6px; font-style:italic; font-size:15px; letter-spacing:.06em; color:#f5b8c6; opacity:.85; }
  .pz-foot {
    position:absolute; left:0; right:0; bottom:calc(env(safe-area-inset-bottom) + 22px);
    text-align:center; font-size:12px; letter-spacing:.25em; text-transform:uppercase;
    color:#f5b8c6; opacity:.6; pointer-events:none;
  }
  #board { position:absolute; }
  #board svg { position:absolute; inset:0; width:100%; height:100%; overflow:visible; }
  #board .guide { pointer-events:none; }
  .piece { pointer-events:none; transition:transform .35s cubic-bezier(.2,1.3,.4,1), filter .2s; }
  .piece path.hit { pointer-events:visiblePainted; cursor:grab; touch-action:none; }
  .piece.drag { transition:filter .2s; filter:drop-shadow(0 14px 18px rgba(0,0,0,.55)); }
  .piece.drag path.hit { cursor:grabbing; }
  .piece.placed path.hit { pointer-events:none; }
  #board.done { animation:beat 1.1s ease-in-out 2; }
  #board.done .piece { filter:drop-shadow(0 0 18px rgba(255,70,110,.8)); }
  @keyframes beat { 0%,100% { transform:scale(1); } 20% { transform:scale(1.1); } 40% { transform:scale(.97); } 60% { transform:scale(1.06); } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hint" id="hint">Toca para más rosas 🌹</div>
<div id="scene">
  <div id="env">
    <div class="env-back"></div>
    <div class="env-clip" id="clip">
      <div id="letter">
        <div class="letter-body">
          <div class="l-to">Para</div>
          <div class="l-name">Karin</div>
          <div class="l-div">♥</div>
          <div class="l-msg">Todas estas rosas<br>son para ti 🌹</div>
        </div>
        <div class="poodle left"><img src="poodle.png" alt="Poodle"></div>
        <div class="poodle right"><img src="poodle.png" alt="Poodle"></div>
      </div>
    </div>
    <div class="env-front"></div>
    <div class="env-flap"></div>
    <div class="seal">♥</div>
  </div>
</div>
<div id="final"></div>
<div id="puzzle">
  <div class="pz-head">
    <div class="pz-title" id="pzTitle">Arma el corazón</div>
    <div class="pz-sub" id="pzSub">arrastra cada pieza a su lugar</div>
  </div>
  <div id="board"></div>
  <div class="pz-foot">♥</div>
</div>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W = 0, H = 0, DPR = Math.min(window.devicePixelRatio || 1, 2);

  function resize() {
    W = innerWidth; H = innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  addEventListener('resize', resize); resize();

  // ---------- Rose sprites (pre-rendered for speed) ----------
  const PALETTES = [
    { dark:'#5c0010', mid:'#b0001e', light:'#ff3b55' },  // rojo
    { dark:'#4a0012', mid:'#8f0020', light:'#e0213f' },  // carmesí
    { dark:'#7a1840', mid:'#d6407a', light:'#ff9cc2' },  // rosa
    { dark:'#8c3a52', mid:'#f07ca0', light:'#ffd1e0' },  // rosa pálido
    { dark:'#6b0a2a', mid:'#c4124f', light:'#ff5c8a' },  // fucsia
  ];
  const SPRITE = 160;

  function petal(c, r, w) {
    c.beginPath();
    c.moveTo(0, 0);
    c.bezierCurveTo(-w, -r * 0.25, -w * 1.15, -r * 0.95, 0, -r);
    c.bezierCurveTo(w * 1.15, -r * 0.95, w, -r * 0.25, 0, 0);
    c.closePath();
  }

  function makeRose(p, withLeaves) {
    const cv = document.createElement('canvas');
    cv.width = cv.height = SPRITE;
    const c = cv.getContext('2d');
    c.translate(SPRITE / 2, SPRITE / 2);
    const R = SPRITE * 0.36;

    if (withLeaves) {
      for (const a of [-0.6, 2.4, 4.0]) {
        c.save(); c.rotate(a);
        const g = c.createLinearGradient(0, 0, 0, -R * 1.35);
        g.addColorStop(0, '#0f3d12'); g.addColorStop(1, '#3f8f2e');
        c.fillStyle = g;
        c.beginPath(); c.moveTo(0, -R * 0.4);
        c.quadraticCurveTo(-R * 0.35, -R * 0.95, 0, -R * 1.38);
        c.quadraticCurveTo(R * 0.35, -R * 0.95, 0, -R * 0.4);
        c.fill();
        c.strokeStyle = 'rgba(10,40,10,.6)'; c.lineWidth = 1;
        c.beginPath(); c.moveTo(0, -R * 0.45); c.lineTo(0, -R * 1.3); c.stroke();
        c.restore();
      }
    }

    const layers = [
      { n: 6, r: R,        w: R * 0.62, off: 0 },
      { n: 5, r: R * 0.78, w: R * 0.52, off: 0.5 },
      { n: 5, r: R * 0.58, w: R * 0.42, off: 0.15 },
      { n: 4, r: R * 0.40, w: R * 0.32, off: 0.8 },
      { n: 3, r: R * 0.24, w: R * 0.22, off: 0.3 },
    ];
    layers.forEach((L, li) => {
      for (let i = 0; i < L.n; i++) {
        c.save();
        c.rotate(L.off + i * Math.PI * 2 / L.n + (Math.random() - 0.5) * 0.25);
        const g = c.createRadialGradient(0, -L.r * 0.15, 1, 0, -L.r * 0.5, L.r);
        g.addColorStop(0, p.dark);
        g.addColorStop(0.55, p.mid);
        g.addColorStop(1, p.light);
        c.fillStyle = g;
        c.shadowColor = 'rgba(0,0,0,.45)';
        c.shadowBlur = 6 - li;
        petal(c, L.r, L.w);
        c.fill();
        c.shadowBlur = 0;
        c.strokeStyle = 'rgba(40,0,8,.35)'; c.lineWidth = 0.8;
        c.stroke();
        c.restore();
      }
    });

    // Espiral central
    c.strokeStyle = p.dark; c.lineWidth = 1.6; c.lineCap = 'round';
    c.beginPath();
    for (let t = 0; t < Math.PI * 5; t += 0.15) {
      const rr = 1 + t * R * 0.012;
      const x = Math.cos(t) * rr, y = Math.sin(t) * rr;
      t === 0 ? c.moveTo(x, y) : c.lineTo(x, y);
    }
    c.stroke();
    return cv;
  }

  function makePetal(p) {
    const cv = document.createElement('canvas');
    cv.width = cv.height = 40;
    const c = cv.getContext('2d');
    c.translate(20, 32);
    const g = c.createLinearGradient(0, 0, 0, -28);
    g.addColorStop(0, p.dark); g.addColorStop(1, p.light);
    c.fillStyle = g;
    petal(c, 28, 14);
    c.fill();
    return cv;
  }

  const roses = [], petals = [];
  PALETTES.forEach(p => {
    roses.push(makeRose(p, true));
    roses.push(makeRose(p, false));
    petals.push(makePetal(p));
  });

  // ---------- Particles ----------
  const items = [];
  const MAX = reduced ? 120 : (W * H < 500000 ? 380 : 600);
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = arr => arr[(Math.random() * arr.length) | 0];

  function spawn(x, y, vx, vy, isPetal) {
    // En vez de borrar de golpe la más vieja, la desvanecemos suavemente
    if (items.length >= MAX) {
      const old = items.find(o => !o.dying);
      if (old) old.dying = true;
      if (items.length >= MAX * 1.3) return;
    }
    const base = Math.min(W, H);
    items.push({
      x, y, vx, vy,
      rot: rand(0, Math.PI * 2),
      vr: isPetal ? rand(-0.7, 0.7) : rand(-0.5, 0.5),
      size: isPetal ? rand(10, 22) : rand(base * 0.07, base * 0.16),
      img: isPetal ? pick(petals) : pick(roses),
      phase: rand(0, Math.PI * 2),
      sway: isPetal ? rand(18, 40) : rand(10, 28),
      swayF: rand(0.5, 0.9),
      life: 0,
      flip: rand(0.35, 0.8),
      petal: isPetal,
      alpha: 0,
      dying: false,
    });
  }

  function burst(cx, cy, n, power) {
    for (let i = 0; i < n; i++) {
      const a = rand(0, Math.PI * 2);
      const s = rand(power * 0.25, power);
      spawn(cx, cy, Math.cos(a) * s, Math.sin(a) * s - power * 0.25, Math.random() < 0.3);
    }
  }

  // Entrada: una gran explosión de rosas + lluvia inmediata
  function intro() {
    const n = reduced ? 60 : 220;
    burst(W / 2, H / 2, n, Math.max(W, H) * 1.1);
    for (let i = 0; i < (reduced ? 30 : 120); i++) {
      spawn(rand(0, W), rand(-H, 0), rand(-20, 20), rand(60, 160), Math.random() < 0.4);
    }
  }

  let rainAcc = 0, started = false;
  const RAIN_PER_SEC = reduced ? 6 : 28;

  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;

    rainAcc += (started ? RAIN_PER_SEC : 5) * dt;
    while (rainAcc >= 1) {
      rainAcc--;
      spawn(rand(-40, W + 40), -80, rand(-15, 15), rand(50, 140), !started || Math.random() < 0.45);
    }

    ctx.clearRect(0, 0, W, H);
    for (let i = items.length - 1; i >= 0; i--) {
      const o = items[i];
      o.life += dt;
      // Arrastre y gravedad suave
      const drag = Math.pow(0.12, dt);
      o.vx *= drag;
      o.vy = o.vy * drag + (o.petal ? 120 : 220) * dt; // velocidad terminal ~55-105 px/s
      // Balanceo suave tipo hoja que cae (sube de a poco al aparecer)
      const swayIn = Math.min(1, o.life / 1.5);
      o.x += (o.vx + Math.sin(o.life * o.swayF + o.phase) * o.sway * swayIn) * dt;
      o.y += o.vy * dt;
      o.rot += (o.vr + Math.sin(o.life * o.swayF * 0.7 + o.phase) * 0.25) * dt;

      // Aparecer y desaparecer con fundido
      const fadeOutZone = H * 0.18;
      let target = 1;
      if (o.y > H - fadeOutZone) target = Math.max(0, (H + o.size * 0.5 - o.y) / (fadeOutZone + o.size * 0.5));
      if (o.dying) target = 0;
      o.alpha += (target - o.alpha) * Math.min(1, dt * (o.dying ? 2.2 : 1.6));
      if ((o.dying && o.alpha < 0.02) || o.y - o.size > H + 40) { items.splice(i, 1); continue; }

      // Giro 3D aparente, lento y sin que el pétalo desaparezca del todo de canto
      const c = Math.cos(o.life * o.flip + o.phase);
      const sx = Math.sign(c || 1) * (0.3 + 0.7 * Math.abs(c));
      ctx.save();
      ctx.translate(o.x, o.y);
      ctx.rotate(o.rot);
      ctx.scale(o.petal ? sx : 0.9 + 0.1 * c, 1);
      const a = o.alpha * o.alpha * (3 - 2 * o.alpha); // suavizado
      if (a < 0.01) { ctx.restore(); continue; }
      ctx.globalAlpha = a;
      const s = o.size * (o.petal ? 1 : 1.6);
      ctx.drawImage(o.img, -s / 2, -s / 2, s, s);
      ctx.restore();
    }
    requestAnimationFrame(frame);
  }

  function onTap(e) {
    if (!started) return;
    const t = e.touches ? e.touches[0] : e;
    burst(t.clientX, t.clientY, reduced ? 15 : 45, Math.min(W, H) * 0.9);
  }
  addEventListener('pointerdown', onTap);

  // ---------- Sobre que se abre ----------
  function openLetter() {
    const scene = document.getElementById('scene');
    const env = document.getElementById('env');
    const clip = document.getElementById('clip');
    const letter = document.getElementById('letter');
    const vw = innerWidth, vh = innerHeight;
    const EW = Math.min(vw * 0.82, 340), EH = EW * 0.64;
    const LW = EW * 0.9, LH = Math.min(LW * 1.32, vh * 0.7);
    const etop = Math.min(vh - EH - 16, Math.max(vh / 2 - EH / 2, LH + 24));
    const clipH = EH + LH + 40;
    const st = document.documentElement.style;
    st.setProperty('--ew', EW + 'px'); st.setProperty('--eh', EH + 'px');
    st.setProperty('--lw', LW + 'px'); st.setProperty('--lh', LH + 'px');
    st.setProperty('--etop', etop + 'px');
    Object.assign(clip.style, { left: (EW - LW) / 2 + 'px', width: LW + 'px', bottom: '0', height: clipH + 'px' });
    letter.style.top = (clipH - EH + EH * 0.06) + 'px';

    scene.classList.add('show');
    setTimeout(() => env.classList.add('open'), 900);
    setTimeout(() => env.classList.add('flap-back'), 1280);
    setTimeout(() => {
      letter.animate([{ transform: 'translateY(0)' }, { transform: `translateY(${-(LH + EH * 0.06 + 10)}px)` }],
        { duration: 1100, easing: 'cubic-bezier(.5,0,.3,1)', fill: 'forwards' });
    }, 1700);
    setTimeout(() => {
      const r = letter.getBoundingClientRect();
      letter.getAnimations().forEach(a => a.cancel());
      letter.style.top = '';
      document.getElementById('final').appendChild(letter);
      const dx = r.left + r.width / 2 - vw / 2, dy = r.top + r.height / 2 - vh / 2;
      const sc = Math.min(1.12, (vw * 0.92) / LW, (vh * 0.9) / LH);
      letter.animate([{ transform: `translate(${dx}px, ${dy}px) scale(1)` }, { transform: `scale(${sc})` }],
        { duration: 900, easing: 'cubic-bezier(.3,1.2,.4,1)', fill: 'forwards' });
      env.animate([{ transform: 'none', opacity: 1 }, { transform: 'translateY(60vh) rotate(8deg)', opacity: 0 }],
        { duration: 800, easing: 'ease-in', fill: 'forwards' });
      setTimeout(() => letter.classList.add('ready'), 700);
    }, 2900);
  }

  // ---------- Rompecabezas del corazón ----------
  const HEART = 'M100 178 C 30 130, 0 92, 20 52 C 38 16, 84 16, 100 50 C 116 16, 162 16, 180 52 C 200 92, 170 130, 100 178 Z';
  // Borde con "pestaña" de rompecabezas de (x1,y1) a (x2,y2); sign elige el lado de la pestaña
  function edge(x1, y1, x2, y2, sign) {
    const dx = x2 - x1, dy = y2 - y1, nx = -dy * sign, ny = dx * sign;
    const P = (t, n) => `${(x1 + dx * t + nx * n).toFixed(2)},${(y1 + dy * t + ny * n).toFixed(2)}`;
    return ` L${P(0.38, 0)} C${P(0.22, 0.34)} ${P(0.78, 0.34)} ${P(0.62, 0)} L${P(1, 0)}`;
  }
  const E = {
    vTop:  [100, 0, 100, 100, -1], vBot:  [100, 100, 100, 200, 1],
    hLeft: [0, 100, 100, 100, -1], hRight:[100, 100, 200, 100, 1],
  };
  const fwd = k => edge(...E[k]);
  const rev = k => { const [a, b, c, d, sg] = E[k]; return edge(c, d, a, b, -sg); };
  const CELLS = [
    { d: `M-20,-20 L100,-20 L100,0${fwd('vTop')}${rev('hLeft')} L-20,100 Z`, cx: 50, cy: 50 },
    { d: `M100,-20 L220,-20 L220,100 L200,100${rev('hRight')}${rev('vTop')} Z`, cx: 150, cy: 50 },
    { d: `M-20,100 L0,100${fwd('hLeft')}${fwd('vBot')} L100,220 L-20,220 Z`, cx: 50, cy: 150 },
    { d: `M100,220 L100,200${rev('vBot')}${fwd('hRight')} L220,100 L220,220 Z`, cx: 150, cy: 150 },
  ];

  function setupPuzzle() {
    const board = document.getElementById('board');
    const vw = innerWidth, vh = innerHeight;
    const B = Math.min(vw * 0.62, vh * 0.34, 280), q = B / 2, k = B / 200;
    const bx = (vw - B) / 2, by = Math.max(vh * 0.52 - B / 2, vh * 0.22);
    Object.assign(board.style, { left: bx + 'px', top: by + 'px', width: B + 'px', height: B + 'px' });

    const svgNS = 'http://www.w3.org/2000/svg';
    let defs = '<defs><linearGradient id="hg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff4d6d"/><stop offset="1" stop-color="#b3001e"/></linearGradient>';
    CELLS.forEach((c, i) => defs += `<clipPath id="cp${i}"><path d="${c.d}"/></clipPath>`);
    defs += '<clipPath id="hc"><path d="' + HEART + '"/></clipPath></defs>';
    const seams = `M100,0${fwd('vTop')}${fwd('vBot')} M0,100${fwd('hLeft')}${fwd('hRight')}`;
    board.innerHTML = `<svg class="guide" viewBox="0 0 200 200">${defs}
      <path d="${HEART}" fill="rgba(255,120,150,.08)" stroke="rgba(255,190,205,.55)" stroke-width="1.6" stroke-dasharray="5 4"/>
      <g clip-path="url(#hc)"><path d="${seams}" fill="none" stroke="rgba(255,190,205,.4)" stroke-width="1.2" stroke-dasharray="4 4"/></g></svg>`;

    // Posiciones desordenadas alrededor del tablero
    const wide = vw > vh * 0.9;
    let spots = wide
      ? [[bx - q * 1.1, by + q * 0.5], [bx + B + q * 1.1, by + q * 0.5], [bx - q * 1.1, by + B - q * 0.5], [bx + B + q * 1.1, by + B - q * 0.5]]
      : [[vw * 0.27, by - q * 0.62], [vw * 0.73, by - q * 0.62], [vw * 0.27, by + B + q * 0.68], [vw * 0.73, by + B + q * 0.68]];
    spots = spots.sort(() => Math.random() - 0.5);

    let placed = 0, zTop = 10;
    CELLS.forEach((c, i) => {
      const el = document.createElementNS(svgNS, 'svg');
      el.setAttribute('viewBox', '0 0 200 200');
      el.classList.add('piece');
      el.innerHTML = `<g clip-path="url(#cp${i})">
          <path class="hit" d="${HEART}" fill="url(#hg)"/>
          <path d="${c.d}" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="1.4" clip-path="url(#hc)"/>
          <path d="M60 50 q-18 6 -24 28" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="5" stroke-linecap="round" clip-path="url(#hc)"/>
        </g>`;
      el.style.transformOrigin = `${c.cx * k}px ${c.cy * k}px`;
      board.appendChild(el);
      // Mantener la pieza dentro de la pantalla
      const tx0 = Math.min(Math.max(spots[i][0], q * 0.55), vw - q * 0.55) - (bx + c.cx * k);
      const ty0 = Math.min(Math.max(spots[i][1], q * 0.55), vh - q * 0.55) - (by + c.cy * k);
      const st = { x: tx0, y: ty0, r: rand(-22, 22) };
      const apply = () => el.style.transform = `translate(${st.x}px, ${st.y}px) rotate(${st.r}deg)`;
      apply();

      const hit = el.querySelector('path.hit');
      let start = null;
      hit.addEventListener('pointerdown', e => {
        e.preventDefault();
        hit.setPointerCapture(e.pointerId);
        start = { px: e.clientX, py: e.clientY, x: st.x, y: st.y };
        el.style.zIndex = ++zTop;
        el.classList.add('drag');
        st.r = 0; apply();
      });
      hit.addEventListener('pointermove', e => {
        if (!start) return;
        st.x = start.x + e.clientX - start.px;
        st.y = start.y + e.clientY - start.py;
        apply();
      });
      const end = () => {
        if (!start) return;
        start = null;
        el.classList.remove('drag');
        if (Math.hypot(st.x, st.y) < B * 0.16) {
          st.x = 0; st.y = 0; st.r = 0; apply();
          el.classList.add('placed'); el.style.zIndex = 1;
          if (navigator.vibrate) navigator.vibrate(15);
          if (++placed === CELLS.length) solved();
        }
      };
      hit.addEventListener('pointerup', end);
      hit.addEventListener('pointercancel', end);
    });

    function solved() {
      document.getElementById('pzTitle').textContent = '¡Lo lograste!';
      document.getElementById('pzSub').textContent = '♥';
      setTimeout(() => board.classList.add('done'), 350);
      setTimeout(() => document.getElementById('puzzle').classList.add('hide'), 2200);
      setTimeout(start, 2500);
    }
  }

  function start() {
    started = true;
    intro();
    setTimeout(openLetter, 2300);
    setTimeout(() => document.getElementById('hint').classList.add('show'), 7000);
  }

  requestAnimationFrame(frame);
  setupPuzzle();
})();
</script>
</body>
</html>
